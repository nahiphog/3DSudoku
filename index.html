<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Sudoku</title>
  <link rel="stylesheet" href="style.css">
  <script src="sudoku-core.js" defer></script>
  <script src="3d-sudoku.js" defer></script>
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">SUDOKU VARIANTS</p>
      <h1>3D Sudoku</h1>
      <p class="description">A 4 × 4 × 4 cube with 48 visible cells.</p>
      <p><a href="simulation.html">Run a simulation →</a></p>
      <p><a href="verify.html">Verify a puzzle →</a></p>
    </header>
    <section class="workspace cube-workspace" aria-label="3D Sudoku cube">
      <p class="eyebrow">THE CUBE</p>
      <h2>3D Sudoku</h2>
      <button id="generate-cube" type="button">Generate <span aria-hidden="true">↗</span></button>
      <div class="cube-comparison">
        <div><h3>Dug puzzle</h3><svg id="puzzle-cube" class="cube" viewBox="0 0 600 570" role="img" aria-label="Dug 3D Sudoku puzzle"></svg><div class="copy-controls"><button type="button" data-copy="text" data-board="0" disabled>Copy string</button><button type="button" data-copy="image" data-board="0" disabled>Copy image</button></div></div>
        <div><h3>Completed puzzle</h3><svg id="solution-cube" class="cube" viewBox="0 0 600 570" role="img" aria-label="Completed 3D Sudoku puzzle"></svg><div class="copy-controls"><button type="button" data-copy="text" data-board="1" disabled>Copy string</button><button type="button" data-copy="image" data-board="1" disabled>Copy image</button></div></div>
      </div>
      <p id="cube-status" class="status" aria-live="polite">Generate a puzzle to get started.</p>
      <p id="copy-status" class="status" aria-live="polite"></p>
      <div class="highlight-controls" aria-label="Highlight cells">
        <p class="description">Select one or more regions or rows to highlight their cells.</p>
        <h3>Regions</h3>
        <div id="region-controls" class="toggle-list" role="group" aria-label="Regions"></div>
        <h3>Rows</h3>
        <div id="row-controls" class="toggle-list" role="group" aria-label="Rows"></div>
      </div>
    </section>
    <footer>3D SUDOKU <span>•</span> PUZZLE WORKSPACE</footer>
  </main>
</body>
</html>
